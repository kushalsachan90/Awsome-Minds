AWSTemplateFormatVersion: '2010-09-09'

Transform: AWS::Serverless-2016-10-31

Description: >
  Self-Healing-Infra

  SAM Template for Self-Healing Infrastructure Agent

Globals:
  Function:
    Timeout: 3
    LoggingConfig:
      LogFormat: JSON

Resources:

  # ============================================================
  # 1. FAILURE SOURCE
  # ============================================================

  SelfHealingFaultyLambda:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/kushal/faulty-lambda/
      Handler: index.handler
      Runtime: nodejs24.x
      Architectures:
        - x86_64
      Timeout: 10
      AutoPublishAlias: live


  # ============================================================
  # 2. FAILURE DETECTION - CLOUDWATCH ALARM
  # ============================================================

  SelfHealingFaultyLambdaAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: SelfHealing-FaultyLambda-Alarm
      Namespace: AWS/Lambda
      MetricName: Errors

      Dimensions:
        - Name: FunctionName
          Value: !Ref SelfHealingFaultyLambda

      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching


  # ============================================================
  # 3. DIAGNOSIS - ZAMAN
  # ============================================================

  DiagnoseWithBedrockFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/zaman/diagnose-with-bedrock/
      Handler: index.handler
      Runtime: nodejs24.x
      Architectures:
        - x86_64
      Timeout: 30


  # ============================================================
  # 4. FIX - JYOTISH
  # ============================================================

  ApplyFixFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/jyotish/apply-fix/
      Handler: index.handler
      Runtime: nodejs24.x
      Architectures:
        - x86_64
      Timeout: 30

      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - lambda:GetAlias
                - lambda:ListVersionsByFunction
                - lambda:UpdateAlias
                - lambda:UpdateFunctionConfiguration
                - lambda:PutFunctionConcurrency
                - lambda:DeleteFunctionConcurrency
                - lambda:GetFunctionConfiguration
              Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:*"


  # ============================================================
  # 5. INCIDENT CHAT - JYOTISH
  # ============================================================

  AskAboutIncidentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/jyotish/ask-about-incidents/
      Handler: index.handler
      Runtime: nodejs24.x
      Architectures:
        - x86_64
      Timeout: 30


  # ============================================================
  # 6. HUMAN APPROVAL HANDLER
  # ============================================================

  ApprovalFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/kushal/approval-handler/
      Handler: index.handler
      Runtime: nodejs24.x
      Architectures:
        - x86_64
      Timeout: 30

      Policies:
        - Version: "2012-10-17"
          Statement:

            # Approval Handler → DynamoDB
            - Effect: Allow
              Action:
                - dynamodb:UpdateItem
              Resource: !GetAtt IncidentsTable.Arn

            # Approval Handler → Step Functions
            - Effect: Allow
              Action:
                - states:SendTaskSuccess
                - states:SendTaskFailure
              Resource: "*"


  # ============================================================
  # 7. INCIDENT DATA
  # ============================================================

  IncidentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: SelfHealingIncidents
      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: incidentId
          AttributeType: S

      KeySchema:
        - AttributeName: incidentId
          KeyType: HASH


  # ============================================================
  # 8. EVENTBRIDGE
  # ============================================================

  SelfHealingTrigger:
    Type: AWS::Events::Rule

    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:
      Name: SelfHealingTrigger

      Description: >
        Triggers self-healing workflow when infrastructure
        metrics breach thresholds

      EventBusName: default
      State: ENABLED

      EventPattern:
        source:
          - aws.cloudwatch

        detail-type:
          - CloudWatch Alarm State Change

        detail:
          state:
            value:
              - ALARM

      Targets:
        - Id: Iddfa1de24-3c4b-4c13-9a04-cdeb9f222556

          Arn: arn:aws:states:ap-south-1:691588646018:stateMachine:Self-Healing-Orchestrator

          RoleArn: arn:aws:iam::691588646018:role/service-role/Amazon_EventBridge_Invoke_Step_Functions_1487815626


  # ============================================================
  # 9. STEP FUNCTIONS ORCHESTRATOR
  # ============================================================

  SelfHealingOrchestrator:
    Type: AWS::Serverless::StateMachine

    Properties:
      Name: Self-Healing-Orchestrator

      DefinitionUri: statemachine/orchestrator.asl.json

      DefinitionSubstitutions:

        # Step Functions → Diagnose Lambda
        DiagnoseFunctionArn: !GetAtt DiagnoseWithBedrockFunction.Arn

        # Step Functions → Actual faulty Lambda
        FaultyLambdaArn: !GetAtt SelfHealingFaultyLambda.Arn

        # Step Functions → Human Approval Lambda
        ApprovalFunctionArn: !GetAtt ApprovalFunction.Arn

        # Step Functions → Apply Fix Lambda
        ApplyFixFunctionArn: !GetAtt ApplyFixFunction.Arn

      Policies:

        # Step Functions → Diagnose Lambda
        - LambdaInvokePolicy:
            FunctionName: !Ref DiagnoseWithBedrockFunction

        # Step Functions → Approval Lambda
        - LambdaInvokePolicy:
            FunctionName: !Ref ApprovalFunction

        # Step Functions → Apply Fix Lambda
        - LambdaInvokePolicy:
            FunctionName: !Ref ApplyFixFunction

        # Step Functions → DynamoDB
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt IncidentsTable.Arn


  # ============================================================
  # 10. AUTHENTICATION - COGNITO USER POOL
  # ============================================================

  SelfHealingUserPool:
    Type: AWS::Cognito::UserPool

    Properties:
      UserPoolName: SelfHealingOperators

      AutoVerifiedAttributes:
        - email

      UsernameAttributes:
        - email


  # ============================================================
  # 11. COGNITO SPA APP CLIENT
  # ============================================================

  SelfHealingUserPoolClient:
    Type: AWS::Cognito::UserPoolClient

    Properties:
      UserPoolId: !Ref SelfHealingUserPool

      ClientName: SelfHealingDashboardSPA

      GenerateSecret: false

      AllowedOAuthFlows:
        - code

      AllowedOAuthScopes:
        - openid
        - email
        - profile

      AllowedOAuthFlowsUserPoolClient: true

      CallbackURLs:
        - http://localhost:5173/

      LogoutURLs:
        - http://localhost:5173/


  # ============================================================
  # 12. COGNITO HOSTED UI DOMAIN
  # ============================================================

  SelfHealingCognitoDomain:
    Type: AWS::Cognito::UserPoolDomain

    Properties:
      UserPoolId: !Ref SelfHealingUserPool

      Domain: !Sub "self-healing-${AWS::AccountId}"


  # ============================================================
  # 13. FRONTEND APPROVAL API LAMBDA
  # ============================================================

  ApprovalApiFunction:
    Type: AWS::Serverless::Function

    Properties:
      CodeUri: self-healing-azizul/self-healing-azizul/functions/azizul/approval-api/
      Handler: index.handler
      Runtime: nodejs24.x
      Architectures:
        - x86_64
      Timeout: 30

      Environment:
        Variables:
          INCIDENT_TABLE: !Ref IncidentsTable
          ALLOW_ORIGIN: http://localhost:5173

      Policies:
        - Version: "2012-10-17"
          Statement:

            # Approval API → DynamoDB
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Scan
                - dynamodb:UpdateItem
              Resource: !GetAtt IncidentsTable.Arn

            # Approval API → Step Functions
            - Effect: Allow
              Action:
                - states:SendTaskSuccess
                - states:SendTaskFailure
              Resource: "*"


  # ============================================================
  # 14. HTTP API GATEWAY
  # ============================================================

  SelfHealingHttpApi:
    Type: AWS::Serverless::HttpApi

    Properties:
      StageName: $default

      CorsConfiguration:
        AllowOrigins:
          - http://localhost:5173

        AllowHeaders:
          - Authorization
          - Content-Type

        AllowMethods:
          - GET
          - POST
          - OPTIONS

      DefinitionBody:

        openapi: 3.0.1

        info:
          title: Self-Healing Infrastructure API
          version: "1.0"

        paths:

          # ------------------------------------------------------
          # GET /incidents
          # ------------------------------------------------------

          /incidents:
            get:
              security:
                - CognitoAuthorizer: []

              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                payloadFormatVersion: "2.0"
                uri:
                  Fn::Sub: >-
                    arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ApprovalApiFunction.Arn}/invocations


          # ------------------------------------------------------
          # GET /incidents/{id}
          # ------------------------------------------------------

          /incidents/{id}:
            get:
              security:
                - CognitoAuthorizer: []

              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                payloadFormatVersion: "2.0"
                uri:
                  Fn::Sub: >-
                    arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ApprovalApiFunction.Arn}/invocations


          # ------------------------------------------------------
          # POST /incidents/{id}/approve
          # ------------------------------------------------------

          /incidents/{id}/approve:
            post:
              security:
                - CognitoAuthorizer: []

              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                payloadFormatVersion: "2.0"
                uri:
                  Fn::Sub: >-
                    arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ApprovalApiFunction.Arn}/invocations


          # ------------------------------------------------------
          # POST /incidents/{id}/reject
          # ------------------------------------------------------

          /incidents/{id}/reject:
            post:
              security:
                - CognitoAuthorizer: []

              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                payloadFormatVersion: "2.0"
                uri:
                  Fn::Sub: >-
                    arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ApprovalApiFunction.Arn}/invocations


          # ------------------------------------------------------
          # POST /ask
          # ------------------------------------------------------

          /ask:
            post:
              security:
                - CognitoAuthorizer: []

              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                payloadFormatVersion: "2.0"
                uri:
                  Fn::Sub: >-
                    arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AskAboutIncidentsFunction.Arn}/invocations


        # --------------------------------------------------------
        # Cognito JWT Authorizer
        # --------------------------------------------------------

        components:

          securitySchemes:

            CognitoAuthorizer:

              type: openIdConnect

              openIdConnectUrl: !Sub >-
                https://cognito-idp.${AWS::Region}.amazonaws.com/${SelfHealingUserPool}/.well-known/openid-configuration

              x-amazon-apigateway-authorizer:

                type: jwt

                identitySource: "$request.header.Authorization"

                jwtConfiguration:

                  issuer: !Sub >-
                    https://cognito-idp.${AWS::Region}.amazonaws.com/${SelfHealingUserPool}

                  audience:
                    - !Ref SelfHealingUserPoolClient


  # ============================================================
  # 15. LAMBDA PERMISSIONS FOR API GATEWAY
  # ============================================================

  ApprovalApiPermission:
    Type: AWS::Lambda::Permission

    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ApprovalApiFunction
      Principal: apigateway.amazonaws.com

      SourceArn: !Sub >-
        arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${SelfHealingHttpApi}/*/*


  AskAboutIncidentsApiPermission:
    Type: AWS::Lambda::Permission

    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AskAboutIncidentsFunction
      Principal: apigateway.amazonaws.com

      SourceArn: !Sub >-
        arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${SelfHealingHttpApi}/*/*


# ==============================================================
# OUTPUTS
# ==============================================================

Outputs:

  # ------------------------------------------------------------
  # API Gateway URL
  # ------------------------------------------------------------

  ApiUrl:
    Description: HTTP API Gateway URL
    Value: !Sub "https://${SelfHealingHttpApi}.execute-api.${AWS::Region}.amazonaws.com"


  # ------------------------------------------------------------
  # Cognito User Pool ID
  # ------------------------------------------------------------

  CognitoUserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref SelfHealingUserPool


  # ------------------------------------------------------------
  # Cognito SPA Client ID
  # ------------------------------------------------------------

  CognitoClientId:
    Description: Cognito public SPA client ID
    Value: !Ref SelfHealingUserPoolClient


  # ------------------------------------------------------------
  # Cognito Hosted UI Domain
  # ------------------------------------------------------------

  CognitoDomain:
    Description: Cognito Hosted UI domain
    Value: !Sub "self-healing-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com"


  # ------------------------------------------------------------
  # Cognito Region
  # ------------------------------------------------------------

  CognitoRegion:
    Description: Cognito AWS region
    Value: !Ref AWS::Region