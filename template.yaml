AWSTemplateFormatVersion: '2010-09-09'

Transform: AWS::Serverless-2016-10-31

Description: >
  Self-Healing-Infra

  SAM Template for Self-Healing Infrastructure Agent

Globals:
  Function:
    Timeout: 3
    LoggingConfig:
      LogFormat: JSON

Resources:

  # ============================================================
  # 1. FAILURE SOURCE
  # ============================================================

  SelfHealingFaultyLambda:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/kushal/faulty-lambda/
      Handler: index.handler
      Runtime: nodejs24.x
      Architectures:
        - x86_64
      Timeout: 10
      AutoPublishAlias: live


  # ============================================================
  # 2. FAILURE DETECTION - CLOUDWATCH ALARM
  # ============================================================

  SelfHealingFaultyLambdaAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: SelfHealing-FaultyLambda-Alarm
      Namespace: AWS/Lambda
      MetricName: Errors

      Dimensions:
        - Name: FunctionName
          Value: !Ref SelfHealingFaultyLambda

      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching


  # ============================================================
  # 3. DIAGNOSIS - ZAMAN
  # ============================================================

  DiagnoseWithBedrockFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/zaman/diagnose-with-bedrock/
      Handler: index.handler
      Runtime: nodejs24.x
      Architectures:
        - x86_64
      Timeout: 30


  # ============================================================
  # 4. FIX - JYOTISH
  # ============================================================

  ApplyFixFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/jyotish/apply-fix/
      Handler: index.handler
      Runtime: nodejs24.x
      Architectures:
        - x86_64
      Timeout: 30

      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - lambda:GetAlias
                - lambda:ListVersionsByFunction
                - lambda:UpdateAlias
                - lambda:UpdateFunctionConfiguration
                - lambda:PutFunctionConcurrency
                - lambda:DeleteFunctionConcurrency
                - lambda:GetFunctionConfiguration
              Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:*"


  # ============================================================
  # 5. INCIDENT CHAT - JYOTISH
  # ============================================================

  AskAboutIncidentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/jyotish/ask-about-incidents/
      Handler: index.handler
      Runtime: nodejs24.x
      Architectures:
        - x86_64
      Timeout: 30


  # ============================================================
  # 6. HUMAN APPROVAL HANDLER
  # ============================================================

  ApprovalFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/kushal/approval-handler/
      Handler: index.handler
      Runtime: nodejs24.x
      Architectures:
        - x86_64
      Timeout: 30

      Policies:
        - Version: "2012-10-17"
          Statement:

            # Approval Handler → DynamoDB
            - Effect: Allow
              Action:
                - dynamodb:UpdateItem
              Resource: !GetAtt IncidentsTable.Arn

            # Approval Handler → Step Functions
            - Effect: Allow
              Action:
                - states:SendTaskSuccess
                - states:SendTaskFailure
              Resource: "*"


  # ============================================================
  # 7. INCIDENT DATA
  # ============================================================

  IncidentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: SelfHealingIncidents
      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: incidentId
          AttributeType: S

      KeySchema:
        - AttributeName: incidentId
          KeyType: HASH


  # ============================================================
  # 8. EVENTBRIDGE
  # ============================================================

  SelfHealingTrigger:
    Type: AWS::Events::Rule

    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:
      Name: SelfHealingTrigger

      Description: >
        Triggers self-healing workflow when infrastructure
        metrics breach thresholds

      EventBusName: default
      State: ENABLED

      EventPattern:
        source:
          - aws.cloudwatch

        detail-type:
          - CloudWatch Alarm State Change

        detail:
          state:
            value:
              - ALARM

      Targets:
        - Id: Iddfa1de24-3c4b-4c13-9a04-cdeb9f222556

          Arn: arn:aws:states:ap-south-1:691588646018:stateMachine:Self-Healing-Orchestrator

          RoleArn: arn:aws:iam::691588646018:role/service-role/Amazon_EventBridge_Invoke_Step_Functions_1487815626


  # ============================================================
  # 9. STEP FUNCTIONS ORCHESTRATOR
  # ============================================================

  SelfHealingOrchestrator:
    Type: AWS::Serverless::StateMachine

    Properties:
      Name: Self-Healing-Orchestrator

      DefinitionUri: statemachine/orchestrator.asl.json

      # --------------------------------------------------------
      # Values injected into orchestrator.asl.json
      # --------------------------------------------------------

      DefinitionSubstitutions:

        # Step Functions → Diagnose Lambda
        DiagnoseFunctionArn: !GetAtt DiagnoseWithBedrockFunction.Arn

        # Step Functions → Actual faulty Lambda
        FaultyLambdaArn: !GetAtt SelfHealingFaultyLambda.Arn

        # Step Functions → Human Approval Lambda
        ApprovalFunctionArn: !GetAtt ApprovalFunction.Arn

        # Step Functions → Apply Fix Lambda
        ApplyFixFunctionArn: !GetAtt ApplyFixFunction.Arn

      # --------------------------------------------------------
      # Step Functions IAM permissions
      # --------------------------------------------------------

      Policies:

        # Step Functions → Diagnose Lambda
        - LambdaInvokePolicy:
            FunctionName: !Ref DiagnoseWithBedrockFunction

        # Step Functions → Approval Lambda
        - LambdaInvokePolicy:
            FunctionName: !Ref ApprovalFunction

        # Step Functions → Apply Fix Lambda
        - LambdaInvokePolicy:
            FunctionName: !Ref ApplyFixFunction

        # Step Functions → DynamoDB
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource: !GetAtt IncidentsTable.Arn